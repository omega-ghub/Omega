name: Build installers

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast quality gate: types and unit tests must pass before anything ships.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omega/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omega/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: omega-${{ matrix.os }}
          path: |
            apps/omega/release/*.exe
            apps/omega/release/*.dmg
            apps/omega/release/*.AppImage
            apps/omega/release/*.deb
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/omega/release/*.exe
            apps/omega/release/*.dmg
            apps/omega/release/*.AppImage
            apps/omega/release/*.deb

  # The workspaces ship separately from the hub: each is a small package the
  # hub downloads on demand, described by catalog.json.
  modules:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omega/package-lock.json
      - run: npm ci
      - run: npm run build:modules
      - uses: actions/upload-artifact@v4
        with:
          name: omega-apps
          path: |
            apps/omega/dist-modules/*.zip
            apps/omega/dist-modules/catalog.json
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/omega/dist-modules/*.zip
            apps/omega/dist-modules/catalog.json

  # Publishes a GitHub Release (creating the tag server-side) so the installers
  # and the Delta package have stable public download links, and the hub's
  # default catalog URL resolves. Tag pushes are handled by the jobs above.
  release:
    needs: [build, modules]
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - id: ver
        run: echo "v=$(node -p "require('./apps/omega/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Omega ${{ steps.ver.outputs.v }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Omega ${{ steps.ver.outputs.v }}: installers for Windows (.exe), macOS (.dmg) and Linux (.AppImage / .deb), plus the Delta app package and catalog the hub downloads from.
          files: |
            dl/**/*.exe
            dl/**/*.dmg
            dl/**/*.AppImage
            dl/**/*.deb
            dl/**/*.zip
            dl/**/catalog.json
