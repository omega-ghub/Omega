name: Build installers

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omega/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: omega-${{ matrix.os }}
          path: |
            apps/omega/release/*.exe
            apps/omega/release/*.dmg
            apps/omega/release/*.AppImage
            apps/omega/release/*.deb
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/omega/release/*.exe
            apps/omega/release/*.dmg
            apps/omega/release/*.AppImage
            apps/omega/release/*.deb

  # The workspaces ship separately from the hub: each is a small package the
  # hub downloads on demand, described by catalog.json.
  modules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omega/package-lock.json
      - run: npm ci
      - run: npm run build:modules
      - uses: actions/upload-artifact@v4
        with:
          name: omega-apps
          path: |
            apps/omega/dist-modules/*.zip
            apps/omega/dist-modules/catalog.json
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/omega/dist-modules/*.zip
            apps/omega/dist-modules/catalog.json
