name: Build installers

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast quality gate: types and unit tests must pass before anything ships.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omega/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omega/package-lock.json
      - run: npm ci
      # Notarization needs the App Store Connect key as a file on disk.
      - name: Write Apple API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -z "$APPLE_API_KEY_P8" ] && { echo "No Apple API key secret; skipping notarization setup"; exit 0; }
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"
      # scripts/dist.mjs signs when these secrets exist and builds unsigned otherwise.
      - run: npm run ${{ matrix.script }}
        env:
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: omega-${{ matrix.os }}
          path: |
            apps/omega/release/*.exe
            apps/omega/release/*.dmg
            apps/omega/release/*.AppImage
            apps/omega/release/*.deb
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/omega/release/*.exe
            apps/omega/release/*.dmg
            apps/omega/release/*.AppImage
            apps/omega/release/*.deb

  # The workspaces ship separately from the hub: each is a small package the
  # hub downloads on demand, described by catalog.json.
  modules:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omega/package-lock.json
      - run: npm ci
      - run: npm run build:modules
      - uses: actions/upload-artifact@v4
        with:
          name: omega-apps
          path: |
            apps/omega/dist-modules/*.zip
            apps/omega/dist-modules/catalog.json
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/omega/dist-modules/*.zip
            apps/omega/dist-modules/catalog.json
